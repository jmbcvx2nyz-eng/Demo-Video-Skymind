  :root{color-scheme:light;--bg:#f2f1ed;--ink:#2f2e2b;--muted:#716c62;--line:#d4d0c8;--accent:#48655d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'XAerova Text',Arial,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-underline-offset:4px}
  a,button,video{-webkit-tap-highlight-color:transparent}
  a:focus-visible,button:focus-visible,video:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
  button{font:inherit}
  [hidden]{display:none!important}
  .page{max-width:1192px;margin:0 auto;padding:0 48px}
  .header{min-height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}
  .wordmark{display:block;width:188px;height:auto;filter:invert(1)}
  .brand{display:inline-flex;padding:10px 0;text-decoration:none}
  .header-link{font-size:16px;text-decoration:none;padding:12px 0}
  .header-link:hover{text-decoration:underline}

  .play{pointer-events:auto;display:flex;align-items:center;flex-direction:column;gap:14px;border:0;border-radius:8px;background:transparent;color:#fff;cursor:pointer;padding:24px;text-shadow:0 1px 8px #000;font-size:17px;font-weight:600}
  .play-icon{display:grid;place-items:center;width:76px;height:76px;border:1px solid #ffffffb3;border-radius:50%;background:#f9f8f5;color:#2f2e2b;box-shadow:0 4px 30px #0005;transition:transform .18s ease,background .18s ease}

  .play svg{width:25px;height:25px;margin-left:4px}

  <script>
  (() => {
    const video = document.getElementById('video');
    const cover = document.getElementById('cover');
    const play = document.getElementById('play');
    const label = document.getElementById('play-label');
    const error = document.getElementById('error');
    cover.hidden = false;
    play.addEventListener('click', async () => {
      error.hidden = true;
      try {
        if (video.ended) video.currentTime = 0;
        video.muted = false;
        await video.play();
      } catch (_) {
        cover.hidden = true;
        error.hidden = false;
      }
    });
    video.addEventListener('play', () => {
      const hadFocus = document.activeElement === play;
      cover.hidden = true;
      error.hidden = true;
      if (hadFocus) video.focus({preventScroll: true});
    });
    video.addEventListener('ended', () => {
      cover.hidden = false;
      label.textContent = 'Revoir la démonstration';
      play.setAttribute('aria-label', 'Revoir la démonstration de SkyMind avec le son');
    });
    const showError = () => { cover.hidden = true; error.hidden = false; };
    video.addEventListener('error', showError);
    video.querySelector('source').addEventListener('error', showError);
  })();
  </script>
